# tclock — configuração completa (WSL)
# Doc: https://github.com/akitaonrails/clock-tui
# Teclas: Shift+T tema · z esconde widgets · q sai · t timer · d/h popups
# Origem deste arquivo: setup-linux/configs/tclock/config.toml (symlink em ~/.config/tclock/config.toml)

[default]
mode = "clock"

[clock]
show_date = true
timezone = "America/Sao_Paulo"
widget_themes = ["default", "evangelion", "nerv"]

[timer]
durations = ["25m", "5m"]
titles = ["Foco", "Pausa"]

[countdown]
time = "20:00"
title = "Contagem"

# ---------------------------------------------------------------------------
# Widgets — todos SEM grupo (sempre visíveis). Widget de grupo escondido não
# carrega; por isso não usamos grupos aqui.
# ---------------------------------------------------------------------------


# Clima + Quotas (conta 1 e conta 2) — UM widget COMPOSTO.
# O clock-tui nao empilha widgets dentro de uma coluna (cada widget da grade e UMA coluna), entao
# "quotas embaixo do clima" se faz com um comando que imprime os blocos em sequencia.
# O clima tem cache de 900 s (TCLOCK_CLIMA_CACHE) para nao refazer a consulta a cada refresh.
# Ver: <ai-memory> gotchas/tclock-layout-da-grade-e-espaco-vazio.md
[[clock.widgets]]
title = "Clima + Quotas OpenCode Go"
command = ["tclock-clima-quotas"]
refresh_secs = 120
[[clock.widgets.popup_actions]]
key = "m"
label = "detalhes conta 1"
command = ["quota-meter", "--details"]

[[clock.widgets.popup_actions]]
key = "n"
label = "detalhes conta 2"
command = ["quota-meter-2", "--details"]


# Compactação de sessão (opencode-compact-if-big) — teto de contexto + travas
# Doc/política: generic-dev/knowledge/opencode.md §12
[[clock.widgets]]
title = "Compactação OpenCode"
command = ["opencode-compact-if-big", "--status", "--sessions", "10"]
refresh_secs = 120
# position = bottom: a GRADE de widgets comporta 2-6 colunas (README do clock-tui) e ja temos 4
# widgets nela - sem isto o widget fica fora da tela (bug observado em 30/09/2026).
#position = "bottom"
[[clock.widgets.popup_actions]]
key = "l"
label = "lista (dry-run)"
args = ["--list", "--limit", "6", "--no-titles"]
[[clock.widgets.popup_actions]]
key = "t"
label = "TUI (nova janela)"
command = ["compact-tui"]
[[clock.widgets.popup_actions]]
key = "2"
label = "conta 2 (status)"
command = ["opencode-2-compact", "--status"]

# Saúde do sistema (faixa inferior, largura total)
[[clock.widgets]]
title = ""
command = ["tclock-system-health", "--exclude-mount", "/run/media"]
refresh_secs = 300
#
[[clock.widgets.popup_actions]]
key = "h"
label = "detalhes"
args = ["--details"]

# Fila do GitHub
# --limit 3: a GRADE de widgets tem altura uniforme (= a coluna mais alta). Com --limit 8 este
# widget tinha 23 linhas contra 5/6/3 dos vizinhos, deixando ~18 linhas vazias embaixo deles.
# A lista completa continua acessivel no popup "d" (--limit 50 --sort stale).
[[clock.widgets]]
title = "GitHub pending"
command = ["ghpending", "--limit", "5"]
# position = bottom (pedido do operador, 30/09/2026): a lista do GitHub fica na faixa de largura
# total, embaixo da grade - as linhas longas dos PRs ganham a largura toda e a grade fica so com
# o painel composto (Clima + Quotas).
position = "bottom"
refresh_secs = 900
[[clock.widgets.popup_actions]]
key = "d"
label = "detalhes"
args = ["--limit", "50", "--sort", "stale"]

# Uso OFICIAL (ai-usagebar): uma linha por conta, com uso + tempo de reset.
# O painel completo (21 linhas) fica nos popups: "o" (conta 1) e "p" (conta 2).
[[clock.widgets]]
title = "Uso oficial (ai-usagebar)"
command = ["tclock-ai-usage"]  # modo completo: todos os vendors + conta 2
refresh_secs = 300
position = "bottom"
[[clock.widgets.popup_actions]]
key = "o"
label = "painel oficial (todos os vendors)"
command = ["ai-usagebar", "usage"]
[[clock.widgets.popup_actions]]
key = "p"
label = "painel oficial conta 2"
command = ["ai-usagebar", "--config", "/home/marcos/.config/ai-usagebar/config2.toml", "--vendor", "opencode-go", "--pretty"]