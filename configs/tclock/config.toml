# tclock — configuração completa (WSL)
# Doc: https://github.com/akitaonrails/clock-tui
# Teclas: Shift+T tema · z esconde widgets · q sai · t timer · d/h popups
# Origem deste arquivo: setup-linux/configs/tclock/config.toml (symlink em ~/.config/tclock/config.toml)

[default]
mode = "clock"

[clock]
show_date = true
timezone = "America/Sao_Paulo"
widget_themes = ["default", "evangelion", "nerv"]

[timer]
durations = ["25m", "5m"]
titles = ["Foco", "Pausa"]

[countdown]
time = "20:00"
title = "Contagem"

# ---------------------------------------------------------------------------
# Widgets — todos SEM grupo (sempre visíveis). Widget de grupo escondido não
# carrega; por isso não usamos grupos aqui.
# ---------------------------------------------------------------------------

# Fila do GitHub
# --limit 3: a GRADE de widgets tem altura uniforme (= a coluna mais alta). Com --limit 8 este
# widget tinha 23 linhas contra 5/6/3 dos vizinhos, deixando ~18 linhas vazias embaixo deles.
# A lista completa continua acessivel no popup "d" (--limit 50 --sort stale).
[[clock.widgets]]
title = "GitHub pending"
command = ["ghpending", "--limit", "3"]
refresh_secs = 900
[[clock.widgets.popup_actions]]
key = "d"
label = "detalhes"
args = ["--limit", "50", "--sort", "stale"]

# Clima — Conceição do Rio Verde/MG
[[clock.widgets]]
title = "Clima — Conceição do Rio Verde/MG"
command = ["tclock-weather", "--city", "Conceição do Rio Verde", "--days", "3"]
refresh_secs = 1800

# Quotas OpenCode Go (medidor — quota-meter: tabela numérica por modelo + oficiais)
[[clock.widgets]]
title = "Quotas OpenCode Go"
command = ["quota-meter", "--tclock"]
refresh_secs = 120
[[clock.widgets.popup_actions]]
key = "m"
label = "detalhes"
args = ["--details"]

# Quadro oficial do OpenCode Go (ai-usagebar, sob demanda via popup "o")
[[clock.widgets.popup_actions]]
key = "o"
label = "oficial (ai-usagebar)"
command = ["ai-usagebar", "--vendor", "opencode-go", "--pretty"]

# Quotas OpenCode Go — conta 2 (instância isolada ~/.opencode-go2)
[[clock.widgets]]
title = "Quotas Go · conta 2"
command = ["quota-meter-2", "--tclock"]
refresh_secs = 120
[[clock.widgets.popup_actions]]
key = "n"
label = "detalhes"
args = ["--details"]

# Compactação de sessão (opencode-compact-if-big) — teto de contexto + travas
# Doc/política: generic-dev/knowledge/opencode.md §12
[[clock.widgets]]
title = "Compactação OpenCode"
command = ["opencode-compact-if-big", "--status"]
refresh_secs = 120
# position = bottom: a GRADE de widgets comporta 2-6 colunas (README do clock-tui) e ja temos 4
# widgets nela - sem isto o widget fica fora da tela (bug observado em 30/09/2026).
position = "bottom"
[[clock.widgets.popup_actions]]
key = "l"
label = "lista (dry-run)"
args = ["--list", "--limit", "6", "--no-titles"]
[[clock.widgets.popup_actions]]
key = "t"
label = "TUI (nova janela)"
command = ["compact-tui"]
[[clock.widgets.popup_actions]]
key = "2"
label = "conta 2 (status)"
command = ["opencode-2-compact", "--status"]

# Saúde do sistema (faixa inferior, largura total)
[[clock.widgets]]
title = ""
command = ["tclock-system-health", "--exclude-mount", "/run/media"]
refresh_secs = 300
position = "bottom"
[[clock.widgets.popup_actions]]
key = "h"
label = "detalhes"
args = ["--details"]
